version: '3.8'

# Docker Compose - Services Only (Redis, Qdrant, Ollama)
# Backend and Frontend run locally (not in Docker)
# This is the recommended setup for development!
#
# To run backend locally: uvicorn main:app --reload --port 10000
# To run frontend locally: cd frontend && npm run dev

services:
  redis:
    image: redis:7-alpine
    container_name: pdf-chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ollama service for local LLM (optional - uncomment to use)
  # Uncomment this section if you want to use Ollama instead of Gemini
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: pdf-chatbot-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s

volumes:
  redis_data:
    driver: local
  qdrant_storage:
    driver: local
  ollama_data:
    driver: local

networks:
  default:
    name: pdf-chatbot-network
