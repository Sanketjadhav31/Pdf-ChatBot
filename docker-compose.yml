version: '3.8'

# Docker Compose - Services Only (Redis + Qdrant)
# Backend and Frontend run locally (not in Docker)
# This is the recommended setup for development!

services:
  redis:
    image: redis:7-alpine
    container_name: pdf-chatbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: pdf-chatbot-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "timeout 10s bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Backend and Frontend are commented out - run them locally instead
  # To run backend locally: uvicorn main:app --reload --port 10000
  # To run frontend locally: cd frontend && npm run dev

  # Backend - Uncomment to run in Docker
  backend:
    build: .
    container_name: pdf-chatbot-backend
    ports:
      - "5000:10000"
    env_file:
      - .env
    volumes:
      - ./vector_store_data:/app/vector_store_data
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:10000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend - Uncomment to run in Docker
  frontend:
    build: ./frontend
    container_name: pdf-chatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
  qdrant_storage:
    driver: local

networks:
  default:
    name: pdf-chatbot-network
