[tool.poetry]
name = "pdf-chatbot-rag"
version = "0.2.0"
description = "Backend API for the PDF Chatbot using RAG"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "api"}, {include = "models"}, {include = "services"}]

[tool.poetry.dependencies]
python = ">=3.8.1,<4.0"
fastapi = "0.115.5"
uvicorn = {extras = ["standard"], version = "0.32.1"}
python-multipart = "0.0.18"
pydantic = "2.10.3"
pydantic-core = "2.27.1"
email-validator = "2.2.0"
pypdf2 = "3.0.1"
numpy = "1.26.4"
httpx = "0.28.1"
langchain = "0.1.0"
langchain-community = "0.0.10"
openai = "1.12.0"
python-dotenv = "1.0.0"
google-generativeai = "*"
motor = "3.6.0"
pymongo = "4.9.1"
python-jose = {extras = ["cryptography"], version = "3.3.0"}
passlib = {extras = ["bcrypt"], version = "1.7.4"}
dnspython = "2.7.0"
bcrypt = "4.2.1"
faiss-cpu = "*"

[tool.poetry.group.dev.dependencies]
pytest = "7.4.3"
pytest-asyncio = "0.21.1"
pytest-cov = "4.1.0"
pytest-mock = "3.12.0"
pytest-benchmark = "4.0.0"
pytest-html = "4.1.1"
faker = "20.1.0"
reportlab = "4.0.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "uvicorn main:app --reload --port 5000"
